# İşlenmiş veriyi üretme ayarları (scripts/00_build_processed_data.py).
# Veri birimi yüzde: 0.45 = %0,45. Bileşik getiri hesaplarken 100'e bölün.

paths:
  sectors: data/raw/49_sektor_gunluk_getiri_temiz.csv
  ff3: data/raw/ff3_daily_clean.csv
  processed: data/processed

data_prep:
  raw_start: "1983-01-01"       # ham birleştirilmiş dosyaların başlangıcı
  analysis_start: "1985-01-01"  # artık / beta / oynaklık dosyalarının başlangıcı
  warmup_from: "1979-01-01"     # içeride kullanılan en erken ham veri (aylık 60 aylık pencere için)
  windows:                      # frekans: [beta penceresi, pencerede en az gözlem]
    gunluk: [252, 200]          # ~1 yıl
    haftalik: [104, 84]         # 2 yıl
    2haftalik: [52, 42]         # 2 yıl
    aylik: [60, 48]             # 5 yıl

# Ortak zaman ayrımı: bütün ekip bu tarihleri kullanır (src/sektorgraf/data/splits.py).
# Zaman sırasına göre, karıştırmadan. Test dönemine ayar seçerken bakılmaz.
split:
  train: ["1985-01-01", "2012-12-31"]   # eğitim (1987, dot-com, 2008 krizleri dahil)
  val:   ["2013-01-01", "2018-12-31"]   # doğrulama: ayar (hiperparametre) seçimi
  test:  ["2019-01-01", "2026-09-30"]   # test (2020, 2022, 2025 krizleri dahil)
