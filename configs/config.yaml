# Bütün ayarlar burada. Kodun içine tarih, yol veya sabit sayı yazmayın.

paths:
  sectors: data/raw/49_sektor_gunluk_getiri_temiz.csv
  ff3: data/raw/ff3_daily_clean.csv
  processed: data/processed
  results: results            # sonuçlar results/<frekans>/ altına yazılır

# Veri birimi yüzde: 0.45 = %0,45. Bileşik getiri hesaplarken 100'e bölün.

# --- Analizde hangi işlenmiş veri kullanılacak (scripts/02, 03, 04)
data:
  frequency: haftalik         # haftalik (ana) | gunluk (sağlamlık) | 2haftalik | aylik
  residual_model: ff3         # ff3 | capm  (capm için önce: 00_build_processed_data.py --capm)
  drop_last_partial: true     # son satır (2026-09-30) kısmi dönem; günlük hariç atılır

# --- İşlenmiş veriyi üretme (scripts/00_build_processed_data.py)
data_prep:
  raw_start: "1983-01-01"       # ham birleştirilmiş dosyaların başlangıcı
  analysis_start: "1985-01-01"  # artık / beta / oynaklık dosyalarının başlangıcı
  warmup_from: "1979-01-01"     # içeride kullanılan en erken ham veri (aylık 60 aylık pencere için)
  windows:                      # frekans: [beta penceresi, pencerede en az gözlem]
    gunluk: [252, 200]          # ~1 yıl
    haftalik: [104, 84]         # 2 yıl
    2haftalik: [52, 42]         # 2 yıl
    aylik: [60, 48]             # 5 yıl

# --- Zaman ayrımı (karar belgesi, 28 Kasım 2026). Zaman sırasına göre, karıştırmadan.
split:
  train: ["1985-01-01", "2012-12-31"]   # 1987, dot-com ve 2008 krizleri dahil
  val:   ["2013-01-01", "2018-12-31"]   # ayar (hiperparametre) seçimi için
  test:  ["2019-01-01", "2026-09-30"]   # 2020, 2022, 2025; hiçbir model ve graf bu döneme bakarak kurulmaz

graphs:
  granger:
    lags: 1                   # dönem cinsinden (haftalıkta 1 hafta)
    fdr: 0.05
  dy:
    lags: 1
    horizon: 10               # H: kaç dönemlik tahmin hatası ayrıştırılıyor (haftalıkta 10 hafta)
    estimator: lasso          # lasso | ols
    lasso_alpha: 0.01
    rolling_window: 104       # kayan DY penceresi, dönem cinsinden (haftalıkta 2 yıl)
    rolling_step: 4           # kaç dönemde bir hesaplanır (haftalıkta ~ayda bir)

models:
  ar:
    lags: 1
  lasso_var:
    lags: 1
    alpha: 0.01               # henüz ayarlanmadı; val döneminde seçilecek

evaluation:
  # Kriz pencereleri SADECE değerlendirmede kullanılır, hiçbir modelin girdisi değildir.
  # Tarihler yaklaşık; raporda kaynak gösterilerek kesinleştirilecek (NBER / olay tarihleri).
  crises:
    black_monday_1987: ["1987-10-01", "1987-12-31"]
    ltcm_1998:   ["1998-08-01", "1998-10-31"]
    dotcom:      ["2000-03-10", "2002-10-09"]
    gfc_2008:    ["2008-09-01", "2009-03-31"]
    covid_2020:  ["2020-02-20", "2020-04-30"]
    rates_2022:  ["2022-01-03", "2022-10-14"]
    tariff_2025: ["2025-04-02", "2025-04-30"]
