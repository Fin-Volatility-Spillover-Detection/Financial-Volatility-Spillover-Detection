[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sektorgraf"
version = "0.1.0"
description = "Sektörler arası etki grafı: FF3 artıkları, Diebold–Yılmaz ve graf tabanlı ML"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
