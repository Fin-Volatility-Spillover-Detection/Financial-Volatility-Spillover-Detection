[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sektorgraf"
version = "0.1.0"
description = "49 sektör getirisi için veri hazırlığı: dönemlere birleştirme ve kayan pencereli FF3 artıkları"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
